<!--
  The app icon: Rose Castle under its star, in the colours of the castle
  theme. Drawn simply on purpose — it has to read at the size of a thumbnail
  on a cluttered home screen, so it is one shape (a castle), one accent (the
  gold star) and nothing else.

  The art stays inside the middle two thirds, because Android crops adaptive
  icons to a circle or a squircle depending on the phone.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCE6D6"/>
      <stop offset="0.55" stop-color="#F2D6EA"/>
      <stop offset="1" stop-color="#DCCCF2"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6A8C6"/>
      <stop offset="1" stop-color="#E2557A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Hills, the same two the world opens on. -->
  <path d="M0 742Q190 650 420 706T1024 668V1024H0z" fill="#D2C0EC"/>
  <path d="M0 822Q290 742 600 782T1024 758V1024H0z" fill="#C3B0E4"/>

  <!-- Everything that must survive the crop sits in one group, scaled into
       the middle two thirds. Phones mask this to a circle, a squircle or a
       rounded square, and a clipped star would look like a mistake. -->
  <g transform="translate(512 560) scale(0.74) translate(-512 -512)">
    <rect x="286" y="470" width="120" height="300" rx="14" fill="#FFFBF7"/>
    <path d="M276 470L346 356l70 114z" fill="url(#roof)"/>
    <rect x="618" y="470" width="120" height="300" rx="14" fill="#FFFBF7"/>
    <path d="M608 470L678 356l70 114z" fill="url(#roof)"/>
    <circle cx="346" cy="546" r="26" fill="#C3B0E4"/>
    <circle cx="678" cy="546" r="26" fill="#C3B0E4"/>

    <!-- The keep, with its door. -->
    <rect x="396" y="520" width="232" height="250" rx="16" fill="#FFFBF7"/>
    <path d="M380 520L512 302l132 218z" fill="url(#roof)"/>
    <path d="M462 770V642a50 50 0 0 1 100 0v128z" fill="#8E7CC3"/>
    <circle cx="542" cy="706" r="9" fill="#F2B940"/>

    <!-- The star Luna is looking for. -->
    <path d="M512 92l34 72 78 11-56 55 13 78-69-37-69 37 13-78-56-55 78-11z" fill="#F2B940"/>
  </g>
</svg>
